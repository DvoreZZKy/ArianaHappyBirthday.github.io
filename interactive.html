    <style>
      /* Стили для анимации текста */
      #surprise-text {
        transition: opacity 0.4s ease, transform 0.4s ease;
        opacity: 1;
        transform: translateY(0);
      }
      #surprise-text.fade-out {
        opacity: 0;
        transform: translateY(10px); /* Текст уезжает чуть вниз */
      }
      #surprise-text.fade-in {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
